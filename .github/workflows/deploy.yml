name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
      - uses: actions/checkout@3
      
      - name: Setup Node.js
      - uses: actions/setup-node@d3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
      - run: npm ci
      
      - name: Lint code
      - run: npm run lint
      
      - name: Run tests
      - run: npm run test
      
      - name: Build project
      - run: npm run build
      
      - name: Upload build artifacts
      - uses: actions/upload-artifact@3
        with:
          name: dist
          path: dist
      
  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
      - uses: actions/download-artifact@3
        with:
          name: dist
          path: dist
      
      - name: Deploy to Netlify
      - run: echo "Deployment to Netlify will be automatic from main branch"